const mkEps = (n, base, baseAr, dur, padFrom = 0) =>
  Array.from({ length: n }, (_, i) => ({
    num: i + 1,
    titre: `${base} — Épisode ${i + 1}`,
    titreAr: `${baseAr} — الحلقة ${i + 1}`,
    duree: dur,
    pad: i >= padFrom && i < n - 2,
    support: `SUP-${1000 + i * 3}`,
    tc: `10:00:0${i % 10}:00`,
  }));

function hist(lastISO, count, chaine) {
  const out = []; const d = new Date(lastISO);
  for (let i = 0; i < count; i++) {
    out.push({
      date: d.toISOString().slice(0, 10),
      heure: ["20:45", "14:00", "09:00", "23:45", "18:30"][i % 5],
      chaine, ep: ((i * 3) % 12) + 1,
      type: i % 3 === 0 ? "Diffusion" : "Rediffusion",
      vecteur: i % 4 === 1 ? "TNT" : "TNT + SAT",
      part: (4 + ((i * 7) % 90) / 10).toFixed(1),
    });
    d.setDate(d.getDate() - (7 + (i % 4)));
  }
  return out;
}

PROGRAMS.forEach((p) => { p.duree = p.episodes[0].duree; });

/* ═══════════════════════════════════════════════════════ 4. UTILITAIRES    */
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = (d) => { const x = new Date(d); return addDays(x, -((x.getDay() + 6) % 7)); };
const fmtDate = (d) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtShort = (d) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`;
const clock = (min) => `${pad2(Math.floor((min % 1440) / 60))}:${pad2(Math.round(min) % 60)}`;
const dur = (min) => (min >= 60 ? `${Math.floor(min / 60)}h${min % 60 ? pad2(min % 60) : ""}` : `${min} min`);
const prog = (id) => PROGRAMS.find((p) => p.id === id);
const uid = () => Math.random().toString(36).slice(2, 9);

/** Contrôle des droits interrogé depuis la grille — jamais dans un écran séparé. */
function rightsAt(p, dateISO, channel) {
  if (!p) return { level: "block", label: "Programme inconnu" };
  const d = new Date(dateISO);
  const w = p.droits[0];
  const from = new Date(w.from), to = new Date(w.to);
  if (d < from) return { level: "block", label: `Droits ouverts à partir du ${fmtDate(from)}`, code: "AVANT" };
  if (d > to)   return { level: "block", label: `Droits expirés le ${fmtDate(to)}`, code: "EXPIRE" };
  if (w.used >= w.passages) return { level: "block", label: "Passages contractuels épuisés", code: "PASSAGES" };
  if (w.exclusif && w.exclusif !== channel) return { level: "block", label: `Exclusivité ${w.exclusif}`, code: "EXCL" };
  const j = Math.round((to - d) / 86400000);
  if (j <= 45) return { level: "warn", label: `Fin de droits dans ${j} jours`, code: "FIN", j };
  if (w.passages - w.used <= 5) return { level: "warn", label: `${w.passages - w.used} passages restants`, code: "RESTE" };
  return { level: "ok", label: `Droits ouverts jusqu'au ${fmtDate(to)}`, code: "OK", j };
}
const lastDiff = (p) => p.diffusions[0]?.date ?? null;
const daysSince = (a, b) => (a ? Math.round((new Date(b) - new Date(a)) / 86400000) : 9999);
const initials = (t) => t.split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

/* ═══════════════════════════════════════════ 6. PLAN DE DIFFUSION (timeline) */
/* Le cœur du produit : un axe horaire réel, des blocs proportionnels à la durée.
   Les trous et les chevauchements deviennent visibles à l'œil nu.              */

const vecMatch = (ev, vecteur) =>
  vecteur === "unifie" ? ev.vec !== "sat"
  : vecteur === "tnt"   ? ev.vec === "both" || ev.vec === "tnt"
  :                       ev.vec === "both" || ev.vec === "sat";

function dayEvents(events, dateISO, vecteur) {
  return events
    .filter((e) => e.date === dateISO && vecMatch(e, vecteur))
    .sort((a, b) => a.start - b.start);
}

/** Analyse d'une journée : chevauchements et trous d'antenne. */
function analyseDay(list) {
  const conflicts = new Set(); const gaps = [];
  for (let i = 0; i < list.length; i++) {
    const a = list[i], aEnd = a.start + a.duree;
    const b = list[i + 1];
    if (!b) continue;
    if (b.start < aEnd - 0.5) { conflicts.add(a.id); conflicts.add(b.id); }
    else if (b.start - aEnd >= 5) gaps.push({ start: aEnd, end: b.start });
  }
  return { conflicts, gaps };
}

function TransmissionPlan({
  events, layout, range, channel, vecteur, zoom, selectedId,
  onSelect, onDropNew, onMoveEvent, dragRef, showLayout,
}) {
  const H = (DAY_END - DAY_START) * zoom;
  const hours = [];
  for (let m = DAY_START; m <= DAY_END; m += 60) hours.push(m);

  const minuteFromY = (y) => {
    const raw = DAY_START + y / zoom;
    return Math.max(DAY_START, Math.min(DAY_END - 5, Math.round(raw / 5) * 5));
  };

  return (
    <div style={{ display: "flex", overflow: "auto", maxHeight: "calc(100vh - 168px)", background: T.sunk }}>
      {/* ————— colonne des heures, collante */}
      <div style={{ position: "sticky", left: 0, zIndex: 3, background: T.sunk, borderRight: `1px solid ${T.line}` }}>
        <div style={{ height: 44, borderBottom: `1px solid ${T.line}`, background: T.surface }} />
        <div style={{ position: "relative", height: H, width: 52 }}>
          {hours.map((m) => (
            <div key={m} style={{ position: "absolute", top: (m - DAY_START) * zoom, right: 6, transform: "translateY(-50%)" }}>
              <Mono style={{ fontSize: 10, color: m % 120 === 0 ? T.ink2 : T.muted, fontWeight: m % 120 === 0 ? 600 : 400 }}>
                {clock(m)}
              </Mono>
            </div>
          ))}
        </div>
      </div>

      {/* ————— colonnes des jours */}
      <div style={{ display: "flex", flex: 1, minWidth: 0 }}>
        {range.map((d, di) => {
          const dISO = iso(d);
          const list = dayEvents(events, dISO, vecteur).map((e) => ({ ...e, duree: prog(e.programId).duree ?? 0 }));
          const { conflicts, gaps } = analyseDay(list);
          const dow = (d.getDay() + 6) % 7;
          const bands = showLayout ? layout.filter((b) => b.days.includes(dow)) : [];
          const isToday = dISO === "2026-08-10";

          return (
            <div key={dISO} style={{ flex: 1, minWidth: range.length > 7 ? 132 : 156, borderRight: `1px solid ${T.line}` }}>
              {/* en-tête */}
              <div style={{
                height: 44, borderBottom: `1px solid ${T.line}`, background: isToday ? "#F4F7FF" : T.surface,
                display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 8px",
                position: "sticky", top: 0, zIndex: 2,
              }}>
                <div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, color: isToday ? T.focus : T.ink }}>{DAY_ABBR[dow]}</div>
                  <Mono style={{ fontSize: 10, color: T.muted }}>{fmtShort(d)}</Mono>
                </div>
                <Tag color={list.length ? T.ink2 : T.muted}>{list.length}</Tag>
              </div>

              {/* piste */}
              <div
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => {
                  e.preventDefault();
                  const box = e.currentTarget.getBoundingClientRect();
                  const min = minuteFromY(e.clientY - box.top);
                  const p = dragRef.current;
                  if (!p) return;
                  if (p.type === "move") onMoveEvent(p.id, dISO, min);
                  else onDropNew(dISO, min, p);
                  dragRef.current = null;
                }}
                style={{ position: "relative", height: H, background: T.surface }}
              >
                {/* bandes de grille type */}
                {bands.map((b) => (
                  <div key={b.id} style={{
                    position: "absolute", left: 0, right: 0,
                    top: (b.start - DAY_START) * zoom, height: (b.end - b.start) * zoom,
                    background: gc(b.genre) + "0A", borderTop: `1px solid ${gc(b.genre)}26`,
                    pointerEvents: "none",
                  }}>
                    <span style={{
                      position: "absolute", left: 4, top: 2, fontSize: 8.5, fontWeight: 700,
                      color: gc(b.genre), opacity: .75, letterSpacing: ".03em",
                    }}>{b.nom.toUpperCase()}</span>
                  </div>
                ))}

                {/* lignes horaires */}
                {hours.map((m) => (
                  <div key={m} style={{
                    position: "absolute", left: 0, right: 0, top: (m - DAY_START) * zoom, height: 1,
                    background: m % 120 === 0 ? T.line : T.line2, pointerEvents: "none",
                  }} />
                ))}

                {/* trous d'antenne */}
                {gaps.map((g, i) => (
                  <div key={i} style={{
                    position: "absolute", left: 3, right: 3, top: (g.start - DAY_START) * zoom,
                    height: Math.max(10, (g.end - g.start) * zoom), border: `1px dashed #E3A008`,
                    background: "#FFFBEB", borderRadius: 4, display: "flex", alignItems: "center",
                    justifyContent: "center", pointerEvents: "none",
                  }}>
                    <Mono style={{ fontSize: 8.5, color: T.warn, fontWeight: 600 }}>
                      TROU {Math.round(g.end - g.start)} min
                    </Mono>
                  </div>
                ))}

                {/* blocs */}
                {list.map((ev) => (
                  <EventBlock key={ev.id} ev={ev} zoom={zoom} channel={channel} dateISO={dISO}
                    conflict={conflicts.has(ev.id)} selected={selectedId === ev.id}
                    onSelect={() => onSelect(ev.id)} dragRef={dragRef} />
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function EventBlock({ ev, zoom, channel, dateISO, conflict, selected, onSelect, dragRef }) {
  const p = prog(ev.programId);
  const h = Math.max(20, p.duree * zoom);
  const r = rightsAt(p, dateISO, channel);
  const c = gc(p.genre);
  const dense = h < 46;
  const epObj = p.episodes[ev.ep - 1];

  return (
    <div
      draggable
      onDragStart={() => { dragRef.current = { type: "move", id: ev.id }; }}
      onClick={(e) => { e.stopPropagation(); onSelect(); }}
      style={{
        position: "absolute", left: 3, right: 3, top: (ev.start - DAY_START) * zoom, height: h - 2,
        borderRadius: 5, cursor: "grab", overflow: "hidden", background: conflict ? "#FEF3F2" : c + "12",
        border: `1px solid ${conflict ? T.signal : selected ? T.ink : c + "44"}`,
        borderLeft: `3px solid ${conflict ? T.signal : c}`,
        boxShadow: selected ? "0 0 0 2px rgba(15,26,42,.18)" : "none",
        display: "flex", flexDirection: "column", padding: dense ? "2px 5px" : "4px 6px",
      }}
    >
      <div style={{ display: "flex", alignItems: "baseline", gap: 5 }}>
        <Mono style={{ fontSize: 9, fontWeight: 600, color: T.ink2, flexShrink: 0 }}>{clock(ev.start)}</Mono>
        <span style={{
          fontSize: dense ? 10 : 11, fontWeight: 600, color: T.ink, lineHeight: 1.2,
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: dense ? "nowrap" : "normal",
        }}>{p.titre}</span>
      </div>
      {!dense && (
        <div style={{ fontSize: 9.5, color: T.muted, marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          ÉP.{pad2(ev.ep)} · {epObj?.titre?.split("—")[1]?.trim() ?? ""}
        </div>
      )}
      <div style={{ flex: 1 }} />
      <div style={{ display: "flex", alignItems: "center", gap: 3, flexWrap: "wrap" }}>
        <Mono style={{ fontSize: 8.5, color: T.muted }}>Dur. {dur(p.duree)}</Mono>
        {ev.vec === "sat" && <Tag color={T.gold} style={{ fontSize: 8 }}>SAT</Tag>}
        {ev.vec === "tnt" && <Tag color={T.focus} style={{ fontSize: 8 }}>TNT</Tag>}
        {conflict && <Tag color={T.signal} style={{ fontSize: 8 }}>CHEVAUCH.</Tag>}
        {r.level !== "ok" && <RightsDot level={r.level} size={9} />}
        {!epObj?.pad && <Tag color={T.signal} style={{ fontSize: 8 }}>NON PAD</Tag>}
      </div>
    </div>
  );
}

/* ═════════════════════════════════ 9. CENTRE D'ANOMALIES (par exception)   */
function computeIssues(events, range, layout, channel, vecteur) {
  const out = [];
  range.forEach((d) => {
    const dISO = iso(d); const dow = (d.getDay() + 6) % 7;
    const list = dayEvents(events, dISO, vecteur).map((e) => ({ ...e, duree: prog(e.programId).duree }));
    const { conflicts, gaps } = analyseDay(list);
    const bands = layout.filter((b) => b.days.includes(dow));

    list.forEach((ev) => {
      const p = prog(ev.programId);
      const r = rightsAt(p, dISO, channel);
      if (r.level !== "ok") out.push({ id: ev.id, dISO, at: ev.start, level: r.level === "block" ? "block" : "warn", type: "Droits", msg: `${p.titre} — ${r.label}` });
      if (conflicts.has(ev.id)) out.push({ id: ev.id, dISO, at: ev.start, level: "block", type: "Chevauchement", msg: `${p.titre} chevauche le bloc suivant` });
      if (!p.episodes[ev.ep - 1]?.pad) out.push({ id: ev.id, dISO, at: ev.start, level: "block", type: "Matériel", msg: `${p.titre} ép.${ev.ep} — support non PAD` });
      const band = bands.find((b) => ev.start >= b.start - 1 && ev.start < b.end);
      if (band && band.genre !== p.genre) out.push({ id: ev.id, dISO, at: ev.start, level: "warn", type: "Grille type", msg: `${p.titre} dans « ${band.nom} » (genre attendu : ${band.genre})` });
      if (!band) out.push({ id: ev.id, dISO, at: ev.start, level: "info", type: "Hors grille type", msg: `${p.titre} placé hors des blocs définis` });
    });

    gaps.forEach((g) => {
      if (bands.some((b) => g.start >= b.start && g.start < b.end))
        out.push({ id: null, dISO, at: g.start, level: "warn", type: "Trou d'antenne", msg: `${Math.round(g.end - g.start)} min sans programme à ${clock(g.start)}` });
    });
  });
  return out.sort((a, b) => (a.dISO + pad2(a.at)).localeCompare(b.dISO + pad2(b.at)));
}

            </div>
          </div>
        )}

    </Panel>
  );
}

/* ══════════════════ 12. AUTO-PROGRAMMATION (« scheduling artist »)          */
/* Grille type + réservoir de contenus + règles → génération, puis rapport.   */

function AutoView({ layout, range, channel, events, onGenerate, toast }) {
  const [pool, setPool] = useState(() => PROGRAMS.map((p) => ({
    programId: p.id, enabled: !["P04", "P05", "P12"].includes(p.id),
    separation: p.genre === "Série" ? 1 : 7, maxTx: p.genre === "Série" ? 30 : 4,
    ordre: p.genre === "Série" || p.genre === "Jeunesse" ? "Séquentiel" : "Aléatoire",
  })));
  const [blocks, setBlocks] = useState(() => layout.map((b) => b.id));
  const [opts, setOpts] = useState({ contratValide: true, exclusivite: true, ecraser: false, respectGenre: true });
  const [report, setReport] = useState(null);

  const updPool = (id, patch) => setPool(pool.map((x) => (x.programId === id ? { ...x, ...patch } : x)));

  const run = () => {
    const created = []; const log = [];
    const usedEp = {}; const txCount = {}; const lastPlanned = {};

    const taken = new Set(events.filter((e) => e.vec !== "sat").map((e) => `${e.date}|${e.start}`));

    range.forEach((d) => {
      const dISO = iso(d); const dow = (d.getDay() + 6) % 7;
      layout.filter((b) => blocks.includes(b.id) && b.days.includes(dow)).sort((a, b2) => a.start - b2.start).forEach((b) => {
        const key = `${dISO}|${b.start}`;
        if (taken.has(key) && !opts.ecraser) return;

        const cands = pool.filter((x) => x.enabled).map((x) => {
          const p = prog(x.programId);
          if (opts.respectGenre && p.genre !== b.genre) return null;
          const r = rightsAt(p, dISO, channel);
          if (opts.contratValide && r.level === "block") { return { rejected: `${p.titre} — ${r.label}` }; }
          if (opts.exclusivite && p.droits[0].exclusif && p.droits[0].exclusif !== channel) return null;
          const lp = lastPlanned[p.id];
          if (lp && Math.abs(daysSince(lp, dISO)) < x.separation) return null;
          if ((txCount[p.id] || 0) >= x.maxTx) return null;
          const padEps = p.episodes.filter((e) => e.pad);
          if (!padEps.length) return null;
          const idx = usedEp[p.id] ?? -1;
          const ep = x.ordre === "Séquentiel"
            ? padEps[(idx + 1) % padEps.length]
            : padEps[Math.floor((idx + 3 + b.start) % padEps.length)];
          const score = Math.min(daysSince(lastDiff(p), dISO), 200) * 0.5
            + (r.level === "warn" ? 40 : 0) + padEps.length * 0.8 - (txCount[p.id] || 0) * 6;
          return { x, p, ep, score, r, padEps };
        }).filter(Boolean);

        const viable = cands.filter((c) => !c.rejected).sort((a, b2) => b2.score - a.score);
        cands.filter((c) => c.rejected).slice(0, 1).forEach((c) => log.push({ level: "warn", msg: `${fmtShort(d)} · ${b.nom} — ${c.rejected}` }));

        if (!viable.length) {
          log.push({ level: "block", msg: `${fmtShort(d)} · ${b.nom} — aucun titre éligible en ${b.genre}. Bloc laissé vide.` });
          return;
        }
        const pick = viable[0];
        created.push({ id: uid(), date: dISO, start: b.start, programId: pick.p.id, ep: pick.ep.num, vec: "both", auto: true });
        usedEp[pick.p.id] = pick.padEps.findIndex((e) => e.num === pick.ep.num);
        txCount[pick.p.id] = (txCount[pick.p.id] || 0) + 1;
        lastPlanned[pick.p.id] = dISO;
        if (pick.r.level === "warn") log.push({ level: "warn", msg: `${fmtShort(d)} · ${b.nom} — ${pick.p.titre} : ${pick.r.label}` });
      });
    });

    onGenerate(created, opts.ecraser);
    setReport({ created: created.length, log, blocs: blocks.length });
    toast(`${created.length} transmissions générées sur ${range.length} jours.`);
  };

  const th = { textAlign: "left", padding: "7px 9px", fontSize: 10, color: T.muted, fontWeight: 700, letterSpacing: ".04em", borderBottom: `1px solid ${T.line}` };
  const num = (v, on, w = 52) => (
    <input type="number" value={v} min={0} onChange={(e) => on(Number(e.target.value))}
      style={{ width: w, border: `1px solid ${T.line}`, borderRadius: 6, padding: "3px 6px", fontSize: 11.5, fontFamily: F_MONO }} />
  );

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 320px", gap: 10, alignItems: "start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <Panel>
          <PanelHead icon={Boxes} title="Réservoir de contenus" sub="Les règles gouvernent la génération, titre par titre"
            right={<Mono style={{ fontSize: 10.5, color: T.muted }}>{pool.filter((x) => x.enabled).length} titres actifs</Mono>} />
          <div style={{ overflowX: "auto", maxHeight: "calc(100vh - 330px)", overflowY: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead style={{ position: "sticky", top: 0, background: T.sunk, zIndex: 1 }}>
                <tr>{["", "Titre", "Genre", "Séparation (j)", "Max diff.", "Déjà diff.", "Ordre épisodes", "Stock PAD", "Droits"].map((h) => <th key={h} style={th}>{h.toUpperCase()}</th>)}</tr>
              </thead>
              <tbody>
                {pool.map((x) => {
                  const p = prog(x.programId); const r = rightsAt(p, iso(range[0]), channel);
                  const padN = p.episodes.filter((e) => e.pad).length;
                  return (
                    <tr key={x.programId} style={{ borderBottom: `1px solid ${T.line2}`, opacity: x.enabled ? 1 : .45 }}>
                      <td style={{ padding: "6px 9px" }}>
                        <input type="checkbox" checked={x.enabled} onChange={(e) => updPool(x.programId, { enabled: e.target.checked })} />
                      </td>
                      <td style={{ padding: "6px 9px", fontSize: 11.5, fontWeight: 600 }}>{p.titre}</td>
                      <td style={{ padding: "6px 9px" }}><Tag color={gc(p.genre)}>{p.genre}</Tag></td>
                      <td style={{ padding: "6px 9px" }}>{num(x.separation, (v) => updPool(x.programId, { separation: v }))}</td>
                      <td style={{ padding: "6px 9px" }}>{num(x.maxTx, (v) => updPool(x.programId, { maxTx: v }))}</td>
                      <td style={{ padding: "6px 9px" }}><Mono style={{ fontSize: 11, color: T.muted }}>{p.droits[0].used}</Mono></td>
                      <td style={{ padding: "6px 9px" }}>
                        <select value={x.ordre} onChange={(e) => updPool(x.programId, { ordre: e.target.value })}
                          style={{ border: `1px solid ${T.line}`, borderRadius: 6, padding: "3px 5px", fontSize: 11 }}>
                          <option>Séquentiel</option><option>Aléatoire</option>
                        </select>
                      </td>
                      <td style={{ padding: "6px 9px" }}><Mono style={{ fontSize: 11 }}>{padN}/{p.episodes.length}</Mono></td>
                      <td style={{ padding: "6px 9px" }}><RightsDot level={r.level} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Panel>

        {report && (
          <Panel>
            <PanelHead icon={Sparkles} title="Rapport de génération"
              right={<Tag color={T.ok}>{report.created} transmissions</Tag>} />
            <div style={{ padding: 12, maxHeight: 240, overflowY: "auto", display: "flex", flexDirection: "column", gap: 5 }}>
              {report.log.length === 0 && <div style={{ fontSize: 12, color: T.ok }}>Génération complète, aucun bloc laissé vide.</div>}
              {report.log.map((l, i) => (
                <div key={i} style={{
                  fontSize: 11.5, padding: "6px 9px", borderRadius: 7, lineHeight: 1.4,
                  background: l.level === "block" ? "#FEF3F2" : "#FFFAEB",
                  color: l.level === "block" ? T.signal : T.warn,
                }}>{l.msg}</div>
              ))}
            </div>
          </Panel>
        )}
      </div>

      <div style={{ position: "sticky", top: 68, display: "flex", flexDirection: "column", gap: 10 }}>
        <Panel>
          <PanelHead icon={Wand2} title="Paramètres de génération" />
          <div style={{ padding: 12 }}>
            <Sec title="Période">
              <div style={{ fontSize: 12, color: T.ink2 }}>
                <Mono>{fmtDate(range[0])}</Mono> → <Mono>{fmtDate(range[range.length - 1])}</Mono>
                <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>{range.length} jours · {channel}</div>
              </div>
            </Sec>

            <Sec title={`Blocs à remplir (${blocks.length}/${layout.length})`}>
              <div style={{ maxHeight: 170, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8 }}>
                {[...layout].sort((a, b) => a.start - b.start).map((b) => {
                  const on = blocks.includes(b.id);
                  return (
                    <label key={b.id} style={{
                      display: "flex", alignItems: "center", gap: 7, padding: "5px 8px", cursor: "pointer",
                      borderBottom: `1px solid ${T.line2}`, fontSize: 11.5,
                    }}>
                      <input type="checkbox" checked={on} onChange={() => setBlocks(on ? blocks.filter((x) => x !== b.id) : [...blocks, b.id])} />
                      <Mono style={{ fontSize: 10, color: T.muted, width: 38 }}>{clock(b.start)}</Mono>
                      <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.nom}</span>
                      <Tag color={gc(b.genre)}>{b.genre.slice(0, 4)}</Tag>
                    </label>
                  );
                })}
              </div>
            </Sec>

            <Sec title="Règles">
              {[
                ["contratValide", "Uniquement les contrats valides"],
                ["exclusivite", "Respecter l'exclusivité de chaîne"],
                ["respectGenre", "Respecter le genre de la grille type"],
                ["ecraser", "Écraser la programmation existante"],
              ].map(([k, l]) => (
                <label key={k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", fontSize: 11.5, cursor: "pointer" }}>
                  <input type="checkbox" checked={opts[k]} onChange={(e) => setOpts({ ...opts, [k]: e.target.checked })} />
                  {l}
                </label>
              ))}
            </Sec>

            <Btn variant="solid" onClick={run} style={{ width: "100%", justifyContent: "center", padding: "10px 12px" }}>
              <Play size={14} /> Lancer la génération
            </Btn>
            <div style={{ fontSize: 10.5, color: T.muted, marginTop: 8, lineHeight: 1.5 }}>
              Rien n'est écrit sans votre clic, et tout reste annulable avec ⌘Z. Le rapport détaille chaque bloc
              laissé vide et la raison exacte du refus.
            </div>
          </div>
        </Panel>
      </div>
    </div>
  );
}

/* ————— timeline des fenêtres de droits, sur plusieurs années */
function RightsTimeline({ p }) {
  const y0 = 2024, y1 = 2027;
  const span = new Date(`${y1}-12-31`) - new Date(`${y0}-01-01`);
  const pos = (dISO) => Math.max(0, Math.min(100, ((new Date(dISO) - new Date(`${y0}-01-01`)) / span) * 100));
  const years = []; for (let y = y0; y <= y1; y++) years.push(y);
  const yPos = (y) => pos(y + "-01-01") + "%";

  return (
    <div style={{ border: `1px solid ${T.line}`, borderRadius: 9, padding: 10, background: T.sunk }}>
      <div style={{ position: "relative", height: 16, marginBottom: 4 }}>
        {years.map((y) => (
          <span key={y} style={{ position: "absolute", left: yPos(y), fontSize: 9.5, color: T.muted, fontFamily: F_MONO }}>{y}</span>
        ))}
      </div>
      <div style={{ position: "relative", height: 34, background: T.surface, border: `1px solid ${T.line2}`, borderRadius: 6 }}>
        {years.map((y) => (
          <div key={y} style={{ position: "absolute", left: yPos(y), top: 0, bottom: 0, width: 1, background: T.line2 }} />
        ))}
        {p.droits.map((w, i) => {
          const l = pos(w.from), r = pos(w.to);
          const expired = new Date(w.to) < new Date("2026-08-10");
          return (
            <div key={i} title={`${w.from} → ${w.to}`} style={{
              position: "absolute", left: `${l}%`, width: `${Math.max(1.5, r - l)}%`, top: 6, height: 22,
              background: expired ? T.muted + "33" : gc(p.genre) + "2E",
              border: `1px solid ${expired ? T.muted : gc(p.genre)}`, borderRadius: 4,
              display: "flex", alignItems: "center", paddingLeft: 6, overflow: "hidden",
            }}>
              <Mono style={{ fontSize: 9, color: expired ? T.muted : gc(p.genre), fontWeight: 600, whiteSpace: "nowrap" }}>
                {w.vecteur} · {w.passages - w.used} restants
              </Mono>
            </div>
          );
        })}
        {/* marqueur « aujourd'hui » */}
        <div style={{ position: "absolute", left: `${pos("2026-08-10")}%`, top: -3, bottom: -3, width: 2, background: T.signal, borderRadius: 2 }} />
        {/* diffusions passées */}
        {p.diffusions.map((d, i) => (
          <div key={i} title={`${d.date} · ${d.type}`} style={{
            position: "absolute", left: `${pos(d.date)}%`, bottom: 2, width: 3, height: 5,
            background: d.type === "Diffusion" ? T.ink : T.muted, borderRadius: 2,
          }} />
        ))}
      </div>
      <div style={{ display: "flex", gap: 12, marginTop: 7, fontSize: 9.5, color: T.muted }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
          <span style={{ width: 2, height: 9, background: T.signal }} /> Aujourd'hui
        </span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
          <span style={{ width: 3, height: 5, background: T.ink }} /> Diffusion passée
        </span>
      </div>
    </div>
  );
}

function FicheTitre({ p, channel, events, onClose }) {
  const [tab, setTab] = useState("apercu");
  const [lang, setLang] = useState("Français");
  const r = rightsAt(p, "2026-08-10", channel);
  const planned = events.filter((e) => e.programId === p.id);

  const meta = {
    "Français": [["Titre", p.titre], ["Genre", p.genre], ["Sous-genre", p.sousGenre], ["Synopsis", p.synopsisFr]],
    "العربية":  [["العنوان", p.titreAr], ["النوع", GENRES[p.genre].ar], ["النوع الفرعي", p.sousGenre], ["الملخص", p.synopsisAr]],
    "English":  [["Title", p.titreEn], ["Genre", p.genre], ["Sub-genre", p.sousGenre], ["Synopsis", "—"]],
  };

  return (
    <Panel style={{ position: "sticky", top: 68, display: "flex", flexDirection: "column", maxHeight: "calc(100vh - 90px)" }}>
      <div style={{ padding: 14, borderBottom: `1px solid ${T.line}`, display: "flex", gap: 12 }}>
        <Poster p={p} size={62} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: F_DISPLAY, fontSize: 16, fontWeight: 700, lineHeight: 1.2 }}>{p.titre}</div>
              <div style={{ fontSize: 12, color: T.muted }}>{p.titreAr} · {p.annee}</div>
            </div>
            <Btn size="sm" variant="bare" onClick={onClose}><X size={15} /></Btn>
          </div>
          <div style={{ display: "flex", gap: 4, marginTop: 7, flexWrap: "wrap" }}>
            <Tag color={gc(p.genre)}>{p.genre}</Tag>
            {p.tags.map((t) => <Tag key={t} color={T.muted}>{t}</Tag>)}
          </div>
        </div>
      </div>

      <div style={{
        padding: "8px 14px", display: "flex", alignItems: "center", gap: 7, fontSize: 11.5, fontWeight: 500,
        background: r.level === "ok" ? "#ECFDF3" : r.level === "warn" ? "#FFFAEB" : "#FEF3F2",
        color: r.level === "ok" ? T.ok : r.level === "warn" ? T.warn : T.signal,
        borderBottom: `1px solid ${T.line}`,
      }}>
        <RightsDot level={r.level} size={13} />{r.label} · {p.droits[0].passages - p.droits[0].used} passages restants
      </div>

      <Tabs compact value={tab} onChange={setTab} items={[
        ["apercu", "Aperçu"], ["droits", "Droits", p.droits.length], ["diff", "Diffusions", p.diffusions.length],
        ["eps", "Épisodes", p.episodes.length], ["meta", "Métadonnées"], ["plan", "Programmé", planned.length],
      ]} />

      <div style={{ padding: 14, overflowY: "auto" }}>
        {tab === "apercu" && (
          <>
            <Sec title="Synopsis"><div style={{ fontSize: 12, lineHeight: 1.6, color: T.ink2 }}>{p.synopsisFr}</div></Sec>
            <Sec title="Production">
              <Field label="Type de production" value={p.typeProd} />
              <Field label="Producteur" value={p.producteur} />
              <Field label="Réalisation" value={p.realisateur} />
              <Field label="Interprètes" value={p.casting} />
              <Field label="Contrat" value={p.contrat} mono />
            </Sec>
            <Sec title="Technique">
              <Field label="Durée unitaire" value={dur(p.episodes[0].duree)} />
              <Field label="Épisodes PAD" value={`${p.episodes.filter((e) => e.pad).length} / ${p.episodes.length}`} />
              <Field label="Volume disponible" value={dur(p.episodes.filter((e) => e.pad).length * p.episodes[0].duree)} />
            </Sec>
          </>
        )}

        {tab === "droits" && (
          <>
            <Sec title="Fenêtres de diffusion"><RightsTimeline p={p} /></Sec>
            {p.droits.map((w, i) => (
              <Sec key={i} title={`Fenêtre ${i + 1}`}>
                <Field label="Période" value={`${fmtDate(new Date(w.from))} → ${fmtDate(new Date(w.to))}`} mono />
                <Field label="Vecteurs" value={w.vecteur} />
                <Field label="Exclusivité" value={w.exclusif || "Aucune"} />
                <Field label="Passages" value={`${w.used} consommés / ${w.passages}`} mono />
              </Sec>
            ))}
          </>
        )}

        {tab === "diff" && (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: T.muted, marginBottom: 9 }}>
              <History size={13} /> Historique complet — plus de limite à trois entrées.
            </div>
            {p.diffusions.map((d, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: `1px solid ${T.line2}` }}>
                <Mono style={{ fontSize: 11, width: 76 }}>{d.date}</Mono>
                <Mono style={{ fontSize: 11, color: T.muted, width: 38 }}>{d.heure}</Mono>
                <Mono style={{ fontSize: 10.5, color: T.muted, width: 34 }}>ÉP.{pad2(d.ep)}</Mono>
                <span style={{ fontSize: 11, flex: 1, minWidth: 0 }}>{d.chaine}</span>
                <Tag color={d.type === "Diffusion" ? T.ok : T.muted}>{d.type === "Diffusion" ? "DIFF" : "REDIFF"}</Tag>
                <Mono style={{ fontSize: 9.5, color: T.muted, width: 52, textAlign: "right" }}>{d.vecteur}</Mono>
                <Mono style={{ fontSize: 10, color: T.ink2, width: 34, textAlign: "right" }}>{d.part}%</Mono>
              </div>
            ))}
          </>
        )}

        {tab === "eps" && p.episodes.map((e) => (
          <div key={e.num} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${T.line2}` }}>
            <Mono style={{ fontSize: 10.5, color: T.muted, width: 22 }}>{pad2(e.num)}</Mono>
            <span style={{ fontSize: 11.5, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {e.titre.split("—")[1]?.trim()}
            </span>
            <Mono style={{ fontSize: 9.5, color: T.muted }}>{e.tc}</Mono>
            <Mono style={{ fontSize: 10, color: T.muted }}>{e.support}</Mono>
            <Tag color={e.pad ? T.ok : T.signal}>{e.pad ? "PAD" : "NON PAD"}</Tag>
          </div>
        ))}

        {tab === "meta" && (
          <div style={{ display: "grid", gridTemplateColumns: "104px minmax(0,1fr)", gap: 12 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
              <div style={{ fontSize: 9.5, fontWeight: 700, color: T.muted, letterSpacing: ".06em", marginBottom: 3, display: "flex", alignItems: "center", gap: 4 }}>
                <Languages size={11} /> LANGUES
              </div>
              {Object.keys(meta).map((l) => (
                <button key={l} onClick={() => setLang(l)} style={{
                  textAlign: "left", padding: "6px 8px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5,
                  background: lang === l ? T.ink : "transparent", color: lang === l ? "#fff" : T.ink2, fontWeight: 500,
                }}>{l}</button>
              ))}
            </div>
            <div dir={lang === "العربية" ? "rtl" : "ltr"}>
              {meta[lang].map(([k, v]) => (
                <div key={k} style={{ paddingBottom: 9, marginBottom: 9, borderBottom: `1px solid ${T.line2}` }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: T.muted, letterSpacing: ".04em", marginBottom: 3 }}>{k.toUpperCase()}</div>
                  <div style={{ fontSize: 12, lineHeight: 1.55, color: T.ink }}>{v}</div>
                </div>
              ))}
              <div style={{ fontSize: 10.5, color: T.muted, lineHeight: 1.5 }}>
                Ces champs alimentent l'export vers le site SNRT et les guides de programmes.
              </div>
            </div>
          </div>
        )}

        {tab === "plan" && (
          planned.length ? planned.sort((a, b) => (a.date + a.start).toString().localeCompare(b.date + b.start)).map((e) => (
            <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: `1px solid ${T.line2}` }}>
              <Mono style={{ fontSize: 11, width: 76 }}>{e.date}</Mono>
              <Mono style={{ fontSize: 11, fontWeight: 600, width: 42 }}>{clock(e.start)}</Mono>
              <Mono style={{ fontSize: 10.5, color: T.muted, flex: 1 }}>ÉP.{pad2(e.ep)}</Mono>
              <Tag color={e.vec === "sat" ? T.gold : e.vec === "tnt" ? T.focus : T.ink2}>
                {e.vec === "both" ? "TNT + SAT" : e.vec.toUpperCase()}
              </Tag>
              {e.auto && <Tag color={T.gold}>AUTO</Tag>}
            </div>
          )) : <Empty icon={CalendarRange}>Ce titre n'est pas encore programmé sur la période affichée.</Empty>
        )}
      </div>
    </Panel>
  );
}

/* ═══════════════════════════════════════════════════ 14. CONDUCTEUR        */
const SECONDAIRES = [
  { k: "BA", label: "Bande-annonce", d: 30, c: "#7C3AED" },
  { k: "PUB", label: "Écran publicitaire", d: 180, c: "#0284C7" },
  { k: "JINGLE", label: "Jingle / habillage", d: 10, c: "#64748B" },
  { k: "AUTOPROMO", label: "Autopromo", d: 25, c: "#94660A" },
];

function ConducteurView({ events, range, channel, vecteur, inserts, setInserts, campagnes, toast }) {
  const [di, setDi] = useState(0);
  const [lastId, setLastId] = useState(null);
  const [menu, setMenu] = useState(null);
  const lastRef = useRef(null);
  const dISO = iso(range[Math.min(di, range.length - 1)]);

  useEffect(() => { if (lastRef.current) lastRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, [lastId]);

  const lines = useMemo(() => {
    const base = dayEvents(events, dISO, vecteur);
    const out = []; let tc = null;
    base.forEach((e) => {
      const p = prog(e.programId);
      if (tc === null) tc = e.start;
      out.push({ kind: "prog", key: e.id, tc, planned: e.start, ecart: Math.round(tc - e.start), p, ep: e.ep, d: p.duree });
      tc += p.duree;
      (inserts[e.id] || []).forEach((s2) => {
        out.push({ kind: "sec", key: e.id, id: s2.id, tc, ...s2 });
        tc += s2.d / 60;
      });
    });
    return out;
  }, [events, dISO, vecteur, inserts]);

  const add = (evId, t) => {
    const id = uid();
    setInserts({ ...inserts, [evId]: [...(inserts[evId] || []), { id, type: t.k, label: t.label, d: t.d }] });
    setLastId(id); setMenu(null);
    toast(`${t.label} inséré — la vue reste sur votre dernière insertion.`);
  };
  const del = (evId, id) => setInserts({ ...inserts, [evId]: (inserts[evId] || []).filter((x) => x.id !== id) });

  const totalMin = lines.reduce((a, l) => a + (l.kind === "prog" ? l.d : l.d / 60), 0);
  const ecartMax = Math.max(0, ...lines.filter((l) => l.kind === "prog").map((l) => Math.abs(l.ecart)));
  const autoN = lines.filter((l) => l.kind === "sec" && l.auto).length;
  const manuN = lines.filter((l) => l.kind === "sec" && !l.auto).length;

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 292px", gap: 10, alignItems: "start" }}>
      <Panel>
        <PanelHead icon={ListOrdered} title={`Conducteur d'antenne — ${channel}`} right={
          <>
            <select value={di} onChange={(e) => setDi(Number(e.target.value))} style={{ border: `1px solid ${T.line}`, borderRadius: 7, padding: "4px 7px", fontSize: 11.5 }}>
              {range.map((d, i) => <option key={i} value={i}>{DAY_ABBR[(d.getDay() + 6) % 7]} {fmtShort(d)}</option>)}
            </select>
            <Btn size="sm" variant="solid" onClick={() => toast("Conducteur d'antenne transmis à la régie de diffusion.")}>
              Envoyer à l'antenne
            </Btn>
          </>
        } />
        <div style={{ maxHeight: "calc(100vh - 168px)", overflowY: "auto", padding: 10 }}>
          {!lines.length && <Empty icon={ListOrdered}>Rien au conducteur ce jour-là. Le conducteur se construit à partir du plan de diffusion.</Empty>}
          {lines.map((l, idx) => {
            const isLast = l.id && l.id === lastId;
            const sec = l.kind === "sec" ? SECONDAIRES.find((s2) => s2.k === l.type) : null;
            return (
              <div key={idx} ref={isLast ? lastRef : null}>
                <div style={{
                  display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 8, marginBottom: 3,
                  border: `1px solid ${isLast ? T.ink : T.line2}`,
                  borderLeft: `3px solid ${l.kind === "prog" ? gc(l.p.genre) : sec.c}`,
                  background: l.kind === "prog" ? gc(l.p.genre) + "0C" : T.sunk,
                }}>
                  <Mono style={{ fontSize: 11.5, fontWeight: 600, width: 44 }}>{clock(l.tc)}</Mono>
                  {l.kind === "prog" ? (
                    <>
                      <Poster p={l.p} size={22} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12.5, fontWeight: 600 }}>{l.p.titre}</div>
                        <div style={{ fontSize: 10.5, color: T.muted }}>
                          ÉP.{pad2(l.ep)} · {l.p.episodes[l.ep - 1]?.support} · TC {l.p.episodes[l.ep - 1]?.tc}
                        </div>
                      </div>
                      {l.ecart !== 0 && <Tag color={Math.abs(l.ecart) > 5 ? T.signal : T.warn}>{l.ecart > 0 ? "+" : ""}{l.ecart} min</Tag>}
                      <Tag color={gc(l.p.genre)}>{l.p.genre}</Tag>
                      <Mono style={{ fontSize: 10.5, color: T.muted, width: 46, textAlign: "right" }}>{dur(l.d)}</Mono>
                    </>
                  ) : (
                    <>
                      <div style={{ flex: 1, fontSize: 12 }}>{l.label}</div>
                      {l.auto && <Tag color={T.gold}>AUTO</Tag>}
                      <Tag color={sec.c}>{l.type}</Tag>
                      <Mono style={{ fontSize: 10.5, color: T.muted, width: 46, textAlign: "right" }}>{l.d}s</Mono>
                      <Btn size="xs" variant="bare" onClick={() => del(l.key, l.id)}><X size={12} /></Btn>
                    </>
                  )}
                </div>

                {menu === idx ? (
                  <div style={{ display: "flex", gap: 5, flexWrap: "wrap", padding: 8, border: `1px solid ${T.line}`, borderRadius: 8, marginBottom: 5 }}>
                    {SECONDAIRES.map((s2) => (
                      <Btn key={s2.k} size="sm" onClick={() => add(l.key, s2)}>
                        <span style={{ width: 7, height: 7, borderRadius: 2, background: s2.c }} />{s2.label}
                      </Btn>
                    ))}
                    <Btn size="sm" variant="bare" onClick={() => setMenu(null)}><X size={12} /></Btn>
                  </div>
                ) : (
                  <button onClick={() => setMenu(idx)} style={{
                    display: "flex", width: "100%", alignItems: "center", gap: 6, border: "none",
                    background: "transparent", cursor: "pointer", color: "#C3CAD4", padding: "1px 0 4px",
                  }}>
                    <span style={{ flex: 1, height: 1, background: T.line2 }} />
                    <Plus size={11} />
                    <span style={{ flex: 1, height: 1, background: T.line2 }} />
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </Panel>

      <Panel style={{ position: "sticky", top: 68, padding: 12 }}>
        <div style={{ fontFamily: F_DISPLAY, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>
          {fmtDate(range[Math.min(di, range.length - 1)])}
        </div>
        <Field label="Lignes au conducteur" value={lines.length} />
        <Field label="Programmes" value={lines.filter((l) => l.kind === "prog").length} />
        <Field label="Plan média généré" value={autoN} />
        <Field label="Plan média manuel" value={manuN} />
        <Field label="Volume total" value={dur(Math.round(totalMin))} mono />
        <Field label="Écart maximal" value={`${ecartMax} min`} mono />
        <div style={{ marginTop: 14, padding: 10, background: T.goldSoft, border: `1px solid ${T.goldLine}`, borderRadius: 8, fontSize: 11, color: T.ink2, lineHeight: 1.5 }}>
          <b style={{ color: T.gold }}>Généré, puis modifiable.</b> Les éléments marqués AUTO viennent du plan média
          automatique. Vous les supprimez ou en ajoutez d'autres ici sans rien casser : une nouvelle génération
          conserve vos insertions manuelles.
        </div>
      </Panel>
    </div>
  );
}

/* ══════════════════════════════════════════════ 15. STOCK & BILANS         */
function StockView({ events, channel, toast }) {
  const [genre, setGenre] = useState("Tous"); const [statut, setStatut] = useState("Tous");
  const today = "2026-08-10";

  const rows = useMemo(() => PROGRAMS.filter((p) => {
    if (genre !== "Tous" && p.genre !== genre) return false;
    const r = rightsAt(p, today, channel);
    if (statut === "Droits ouverts" && r.level !== "ok") return false;
    if (statut === "Fin de droits" && r.level !== "warn") return false;
    if (statut === "Hors droits" && r.level !== "block") return false;
    if (statut === "Non programmé" && events.some((e) => e.programId === p.id)) return false;
    return true;
  }), [genre, statut, channel, events]);

  const byGenre = useMemo(() => {
    const m = {};
    rows.forEach((p) => {
      const n = p.episodes.filter((e) => e.pad).length;
      m[p.genre] = m[p.genre] || { nb: 0, h: 0, ep: 0 };
      m[p.genre].nb++; m[p.genre].ep += n; m[p.genre].h += (n * p.episodes[0].duree) / 60;
    });
    return Object.entries(m).sort((a, b) => b[1].h - a[1].h);
  }, [rows]);

  const maxH = Math.max(1, ...byGenre.map(([, v]) => v.h));
  const totalH = byGenre.reduce((a, [, v]) => a + v.h, 0);
  const expiring = PROGRAMS.filter((p) => rightsAt(p, today, channel).level === "warn");
  const blocked = PROGRAMS.filter((p) => rightsAt(p, today, channel).level === "block").length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0,1fr))", gap: 10 }}>
        <Kpi label="Volume disponible" value={`${Math.round(totalH)} h`} sub="épisodes PAD, droits ouverts" />
        <Kpi label="Titres retenus" value={rows.length} sub={`sur ${PROGRAMS.length} au catalogue`} />
        <Kpi label="Fin de droits < 45 j" value={expiring.length} sub="à consommer en priorité" tone={T.warn} />
        <Kpi label="Hors droits" value={blocked} sub="exclus de la programmation" tone={T.signal} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 340px", gap: 10, alignItems: "start" }}>
        <Panel>
          <PanelHead icon={Boxes} title="Situation du stock par genre" right={
            <>
              <Filter size={13} style={{ color: T.muted }} />
              <select value={genre} onChange={(e) => setGenre(e.target.value)} style={{ border: `1px solid ${T.line}`, borderRadius: 7, padding: "4px 7px", fontSize: 11.5 }}>
                <option>Tous</option>{Object.keys(GENRES).map((g) => <option key={g}>{g}</option>)}
              </select>
              <select value={statut} onChange={(e) => setStatut(e.target.value)} style={{ border: `1px solid ${T.line}`, borderRadius: 7, padding: "4px 7px", fontSize: 11.5 }}>
                {["Tous", "Droits ouverts", "Fin de droits", "Hors droits", "Non programmé"].map((s) => <option key={s}>{s}</option>)}
              </select>
              <Btn size="sm" variant="solid" onClick={() => toast("Bilan de stock exporté (Excel, Word, PDF) avec les filtres appliqués.")}>
                <FileDown size={12} /> Bilan
              </Btn>
            </>
          } />
          <div style={{ padding: 14, display: "flex", flexDirection: "column", gap: 11 }}>
            {byGenre.map(([g, v]) => (
              <div key={g}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, marginBottom: 4 }}>
                  <span style={{ fontWeight: 600, color: gc(g) }}>{g} <span style={{ color: T.muted, fontWeight: 400 }}>{GENRES[g].ar}</span></span>
                  <Mono style={{ color: T.ink2 }}>{Math.round(v.h)} h · {v.ep} ép. · {v.nb} titres</Mono>
                </div>
                <div style={{ height: 8, background: T.line2, borderRadius: 5, overflow: "hidden" }}>
                  <div style={{ width: `${(v.h / maxH) * 100}%`, height: "100%", background: gc(g), borderRadius: 5 }} />
                </div>
              </div>
            ))}
            {!byGenre.length && <Empty icon={Boxes}>Aucun titre pour ces filtres.</Empty>}
          </div>
        </Panel>

        <Panel>
          <PanelHead icon={Bell} title="À consommer avant expiration" />
          <div style={{ padding: 10, display: "flex", flexDirection: "column", gap: 7 }}>
            {expiring.map((p) => {
              const r = rightsAt(p, today, channel); const n = p.episodes.filter((e) => e.pad).length;
              return (
                <div key={p.id} style={{ border: "1px solid #FEDF89", background: "#FFFAEB", borderRadius: 9, padding: 9, display: "flex", gap: 9 }}>
                  <Poster p={p} size={28} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>{p.titre}</div>
                    <div style={{ fontSize: 10.5, color: T.warn, marginTop: 2 }}>{r.label}</div>
                    <Mono style={{ fontSize: 10, color: T.muted }}>{n} ép. PAD · {p.droits[0].passages - p.droits[0].used} passages</Mono>
                  </div>
                </div>
              );
            })}
            {!expiring.length && <Empty icon={ShieldCheck}>Aucune fenêtre de droits ne se referme dans les 45 jours.</Empty>}
          </div>
        </Panel>
      </div>
    </div>
  );
}

const Kpi = ({ label, value, sub, tone }) => (
  <Panel style={{ padding: 14 }}>
    <div style={{ fontSize: 9.5, color: T.muted, fontWeight: 700, letterSpacing: ".06em" }}>{label.toUpperCase()}</div>
    <div style={{ fontFamily: F_DISPLAY, fontSize: 27, fontWeight: 700, color: tone || T.ink, marginTop: 4, lineHeight: 1 }}>{value}</div>
    <div style={{ fontSize: 11, color: T.muted, marginTop: 5 }}>{sub}</div>
  </Panel>
);


/* ════════════════════════ 15 bis. PLAN MÉDIA AUTOMATIQUE                   */
/* Campagnes d'autopromotion + règles d'habillage → génération des           */
/* évènements secondaires dans le conducteur, avec rapport de couverture.    */

function genererPlanMedia(events, range, campagnes, opts, existing) {
  const out = {};
  Object.entries(existing).forEach(([k, v]) => { const m = v.filter((x) => !x.auto); if (m.length) out[k] = m; });

  const parJour = {}, total = {}, dernier = {}, parTranche = {};
  campagnes.forEach((c) => { total[c.id] = 0; parTranche[c.id] = {}; });
  const alerts = [];

  range.forEach((d) => {
    const dISO = iso(d);
    const list = dayEvents(events, dISO, "unifie").map((e) => ({ ...e, duree: prog(e.programId).duree }));

    list.forEach((ev, i) => {
      const next = list[i + 1];
      const fin = ev.start + ev.duree;
      const gap = next ? next.start - fin : 0;
      if (gap <= 0) return;
      let reste = Math.round(gap * 60);
      const tk = trancheDe(fin);
      const items = [];

      if (opts.jingle && reste >= 10) { items.push({ id: uid(), type: "JINGLE", label: "Habillage d'inter-programme", d: 10, auto: true }); reste -= 10; }

      if (opts.pub && opts.tranchesPub.includes(tk) && reste >= opts.dureeEcran) {
        items.push({ id: uid(), type: "PUB", label: `Écran publicitaire — ${TRANCHES.find((t) => t.k === tk).label}`, d: opts.dureeEcran, auto: true });
        reste -= opts.dureeEcran;
      }

      let garde = 0;
      while (reste >= 30 && garde++ < 6) {
        const cand = campagnes.map((c) => {
          if (dISO < c.from || dISO > c.to) return null;
          if (total[c.id] >= c.objectif) return null;
          const kj = `${c.id}|${dISO}`;
          if ((parJour[kj] || 0) >= c.maxParJour) return null;
          if (dernier[kj] != null && fin - dernier[kj] < c.separation) return null;
          if (items.some((x) => x.campagneId === c.id)) return null;
          if (opts.futurSeulement) {
            const aVenir = events.some((e) => e.programId === c.programId &&
              (e.date > dISO || (e.date === dISO && e.start > fin)));
            if (!aVenir) return null;
          }
          const p = prog(c.programId);
          const deficit = (c.objectif - total[c.id]) / c.objectif;
          const score = c.priorite * 100 + deficit * 60 + (c.tranches.includes(tk) ? 45 : 0);
          return { c, p, score };
        }).filter(Boolean).sort((a, b) => b.score - a.score)[0];

        if (!cand) break;
        items.push({ id: uid(), type: cand.c.type || "BA", label: `Bande-annonce — ${cand.p.titre}`, d: 30, auto: true, campagneId: cand.c.id });
        reste -= 30;
        const kj = `${cand.c.id}|${dISO}`;
        parJour[kj] = (parJour[kj] || 0) + 1;
        total[cand.c.id] += 1;
        dernier[kj] = fin;
        parTranche[cand.c.id][tk] = (parTranche[cand.c.id][tk] || 0) + 1;
      }

      if (items.length) out[ev.id] = [...(out[ev.id] || []), ...items];
    });
  });

  campagnes.forEach((c) => {
    const p = prog(c.programId);
    if (total[c.id] === 0) alerts.push({ level: "block", msg: `${p.titre} — aucune bande-annonce placée. Élargissez les tranches ciblées ou la période.` });
    else if (total[c.id] < c.objectif) alerts.push({ level: "warn", msg: `${p.titre} — ${total[c.id]}/${c.objectif} bandes-annonces. Espace inter-programmes insuffisant sur les tranches visées.` });
  });

  const nbAuto = Object.values(out).flat().filter((x) => x.auto).length;
  return { inserts: out, rapport: { total, parTranche, alerts, nbAuto } };
}

/* ══════════════════════════════════════════════════════ 18. RACINE         */
function seedEvents(ws, layout, channel) {
  const evs = []; const byGenre = {}; const cnt = {};
  PROGRAMS.forEach((p) => { (byGenre[p.genre] = byGenre[p.genre] || []).push(p); });
  layout.forEach((b, bi) => {
    for (let i = 0; i < 7; i++) {
      if (!b.days.includes(i)) continue;
      if (bi % 5 === 2 && i % 2 === 1) continue;              // trous d'antenne volontaires
      const cands = (byGenre[b.genre] || []).filter((p) => {
        const ex = p.droits[0].exclusif; return !ex || ex === channel;
      });
      if (!cands.length) continue;
      cnt[b.genre] = (cnt[b.genre] || 0) + 1;
      const p = cands[cnt[b.genre] % cands.length];
      const padEps = p.episodes.filter((e) => e.pad); if (!padEps.length) continue;
      const ep = padEps[(i + cnt[b.genre]) % padEps.length].num;
      evs.push({ id: uid(), date: iso(addDays(ws, i)), start: b.start, programId: p.id, ep, vec: "both" });
    }
  });
  if (channel === "Al Aoula") {
    evs.push({ id: uid(), date: iso(ws), start: 21 * 60, programId: "P10", ep: 1, vec: "both" });
    const t = evs.find((e) => e.programId === "P08"); if (t) t.ep = prog("P08").episodes.length;
  }
  return evs;
}

function initCampagnes(channel, layout, ws) {
  const genres = new Set(layout.map((b) => b.genre));
  return PROGRAMS.filter((p) => genres.has(p.genre) && (!p.droits[0].exclusif || p.droits[0].exclusif === channel))
    .slice(0, 4)
    .map((p, i) => ({
      id: uid(), programId: p.id, from: iso(ws), to: iso(addDays(ws, 6)),
      objectif: [12, 9, 6, 5][i] ?? 6, priorite: i === 0 ? 3 : i === 1 ? 2 : 1,
      maxParJour: i === 0 ? 3 : 2, separation: 120,
      tranches: i === 0 ? ["journee", "access", "prime"] : i === 1 ? ["access", "prime"] : ["journee", "access"],
      type: "BA",
    }));
}

function initWorkspaces(ws) {
  const o = {};
  CHANNELS.forEach((ch) => {
    const layout = LAYOUTS[ch];
    o[ch] = { layout, events: seedEvents(ws, layout, ch), inserts: {}, campagnes: initCampagnes(ch, layout, ws) };
  });
  return o;
}

  const [rangeStart, setRangeStart] = useState(WS0);
  const [span, setSpan] = useState(7);

  /* un seul historique, qui couvre tous les espaces de travail */
  const [hist, setHist] = useState(() => [initWorkspaces(WS0)]);
  const [hi, setHi] = useState(0);
  const spaces = hist[hi];
  const cur = spaces[channel];
  const { layout, events, inserts, campagnes } = cur;

  const commitWs = useCallback((patch) => {
    setHist((h) => {
      const base = h[Math.min(hi, h.length - 1)];
      const next = { ...base, [channel]: { ...base[channel], ...patch } };
      return [...h.slice(0, hi + 1), next];
    });
    setHi((i) => i + 1);
  }, [hi, channel]);

  const setLayout = (l) => commitWs({ layout: typeof l === "function" ? l(layout) : l });
  const setEvents = (e) => commitWs({ events: e });
  const setInserts = (m) => commitWs({ inserts: m });
  const setCampagnes = (c) => commitWs({ campagnes: c });

  const [selectedId, setSelectedId] = useState(null);
  const [focusTitle, setFocusTitle] = useState(null);
  const [palette, setPalette] = useState(false);
  const [toasts, setToasts] = useState([]);
  const dragRef = useRef(null);

  const toast = useCallback((msg, kind = "ok") => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3600);
  }, []);

  const range = useMemo(() => Array.from({ length: span }, (_, i) => addDays(rangeStart, i)), [rangeStart, span]);
  const issues = useMemo(() => computeIssues(events, range, layout, channel, vecteur), [events, range, layout, channel, vecteur]);

  useEffect(() => { setSelectedId(null); }, [channel]);

  useEffect(() => {
    const h = (e) => {
      const k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === "k") { e.preventDefault(); setPalette((p) => !p); }
      if ((e.metaKey || e.ctrlKey) && k === "z" && !e.shiftKey) { e.preventDefault(); setHi((i) => Math.max(0, i - 1)); }
      if ((e.metaKey || e.ctrlKey) && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); setHi((i) => Math.min(hist.length - 1, i + 1)); }
      if (e.key === "Escape") { setPalette(false); setSelectedId(null); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [hist.length]);

  /* ————— opérations sur les transmissions */
  const dropNew = (dateISO, start, payload) => {
    const p = prog(payload.programId);
    const r = rightsAt(p, dateISO, channel);
    if (r.level === "block") { toast(`${p.titre} — ${r.label}. Placement refusé.`, "err"); return; }
    const id = uid();
    setEvents([...events, { id, date: dateISO, start, programId: p.id, ep: payload.ep, vec: vecteur === "sat" ? "sat" : "both" }]);
    setSelectedId(id);
    toast(`${p.titre} placé le ${fmtShort(new Date(dateISO))} à ${clock(start)} sur ${channel}.`);
  };

  const moveEvent = (id, dateISO, start) => {
    const ev = events.find((e) => e.id === id); if (!ev) return;
    const r = rightsAt(prog(ev.programId), dateISO, channel);
    if (r.level === "block") { toast(`Déplacement refusé — ${r.label}.`, "err"); return; }
    setEvents(events.map((e) => (e.id === id ? { ...e, date: dateISO, start } : e)));
  };

  const updateEvent = (id, patch) => setEvents(events.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const deleteEvent = (id) => {
    const next = { ...inserts }; delete next[id];
    commitWs({ events: events.filter((e) => e.id !== id), inserts: next });
    setSelectedId(null);
  };

  const duplicateEvent = (id, dates) => {
    const ev = events.find((e) => e.id === id); if (!ev) return;
    const p = prog(ev.programId); const padEps = p.episodes.filter((x) => x.pad);
    const base = padEps.findIndex((x) => x.num === ev.ep);
    const add = []; const refused = [];
    dates.forEach((d, i) => {
      const r = rightsAt(p, d, channel);
      if (r.level === "block") { refused.push(fmtShort(new Date(d))); return; }
      const ep = padEps[(base + i + 1) % padEps.length]?.num ?? ev.ep;
      add.push({ id: uid(), date: d, start: ev.start, programId: p.id, ep, vec: ev.vec });
    });
    setEvents([...events.filter((e) => !add.some((a) => a.date === e.date && a.start === e.start && a.vec === e.vec)), ...add]);
    toast(refused.length
      ? `${add.length} dates programmées. Écartées : ${refused.join(", ")} — droits non ouverts.`
      : `${add.length} dates programmées, épisodes incrémentés.`, refused.length ? "err" : "ok");
  };

  const splitSat = (id) => {
    const ev = events.find((e) => e.id === id); if (!ev || ev.vec !== "both") return;
    const nid = uid();
    setEvents([...events.map((e) => (e.id === id ? { ...e, vec: "tnt" } : e)), { ...ev, id: nid, vec: "sat" }]);
    setVecteur("sat"); setSelectedId(nid);
    toast("Exception satellite créée. Vous êtes basculé sur la vue Satellite pour la modifier.");
  };

  const generate = (created, overwrite) => {
    const keys = new Set(created.map((c) => `${c.date}|${c.start}`));
    const kept = overwrite ? events.filter((e) => e.vec === "sat" || !keys.has(`${e.date}|${e.start}`)) : events;
    const existing = new Set(kept.filter((e) => e.vec !== "sat").map((e) => `${e.date}|${e.start}`));
    setEvents([...kept, ...created.filter((c) => !existing.has(`${c.date}|${c.start}`))]);
  };

  const openTitle = (id) => { setFocusTitle(id); setView("catalogue"); };
  const m = CH_META[channel];

  return (
    <div style={{ background: T.paper, minHeight: "100vh", fontFamily: "Inter, system-ui, sans-serif", color: T.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        input, select, button { font-family: Inter, system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: #C9D1DB; border-radius: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #1F4FD8; outline-offset: 1px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header style={{
        height: 54, background: T.surface, borderBottom: `1px solid ${T.line}`,
        borderTop: `3px solid ${m.couleur}`, display: "flex", alignItems: "center", gap: 12,
        padding: "0 14px", position: "sticky", top: 0, zIndex: 60,
      }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 7 }}>
          <span style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 17, letterSpacing: "-.02em" }}>STM</span>
          <span style={{ fontFamily: F_MONO, fontSize: 9.5, fontWeight: 600, color: T.gold, background: T.goldSoft, padding: "2px 5px", borderRadius: 4, letterSpacing: ".06em" }}>NEXT</span>
        </div>
        <div style={{ width: 1, height: 22, background: T.line }} />

        {/* sélecteur d'espace de travail */}
        <div style={{ display: "flex", alignItems: "center", gap: 7, border: `1px solid ${T.line}`, borderRadius: 9, padding: "3px 8px 3px 4px" }}>
          <span style={{
            width: 24, height: 24, borderRadius: 6, background: m.couleur, color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 10,
          }}>{m.code}</span>
          <div>
            <select value={channel} onChange={(e) => setChannel(e.target.value)} style={{
              border: "none", background: "transparent", fontSize: 12.5, fontWeight: 600, color: T.ink, padding: 0, cursor: "pointer",
            }}>{CHANNELS.map((c) => <option key={c}>{c}</option>)}</select>
            <div style={{ fontSize: 9.5, color: T.muted, marginTop: -2 }}>{m.ligne}</div>
          </div>
        </div>

        {(view === "plan" || view === "conducteur") && (
          <div style={{ display: "flex", background: T.paper, borderRadius: 8, padding: 2, border: `1px solid ${T.line}` }}>
            {[["unifie", "Unifié", Layers3], ["tnt", "TNT", Tv], ["sat", "Satellite", Radio]].map(([k, l, Ico]) => (
              <button key={k} onClick={() => setVecteur(k)} style={{
                display: "flex", alignItems: "center", gap: 5, border: "none", cursor: "pointer", padding: "5px 10px",
                borderRadius: 6, fontSize: 11.5, fontWeight: 600,
                background: vecteur === k ? T.surface : "transparent", color: vecteur === k ? T.ink : T.muted,
                boxShadow: vecteur === k ? "0 1px 2px rgba(15,26,42,.1)" : "none",
              }}><Ico size={12} />{l}</button>
            ))}
          </div>
        )}

        <div style={{ flex: 1 }} />

        {view !== "layout" && view !== "stock" && (
          <>
            <Btn size="sm" onClick={() => setRangeStart(WS0)}>Aujourd'hui</Btn>
            <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
              <Btn size="sm" variant="bare" onClick={() => setRangeStart(addDays(rangeStart, -span))}><ChevronLeft size={15} /></Btn>
              <Mono style={{ fontSize: 11.5, color: T.ink2, minWidth: 148, textAlign: "center", fontWeight: 500 }}>
                {fmtDate(range[0])} → {fmtDate(range[range.length - 1])}
              </Mono>
              <Btn size="sm" variant="bare" onClick={() => setRangeStart(addDays(rangeStart, span))}><ChevronRight size={15} /></Btn>
            </div>
            <select value={span} onChange={(e) => setSpan(Number(e.target.value))} style={{
              border: `1px solid ${T.line}`, borderRadius: 8, padding: "5px 7px", fontSize: 11.5, color: T.ink2,
            }}>
              <option value={1}>1 jour</option><option value={7}>Semaine</option><option value={14}>2 semaines</option>
            </select>
            <div style={{ width: 1, height: 22, background: T.line }} />
          </>
        )}

        <Btn size="sm" variant="bare" disabled={hi === 0} onClick={() => setHi((i) => Math.max(0, i - 1))} title="Annuler (⌘Z)"><Undo2 size={15} /></Btn>
        <Btn size="sm" variant="bare" disabled={hi >= hist.length - 1} onClick={() => setHi((i) => Math.min(hist.length - 1, i + 1))} title="Rétablir (⌘⇧Z)"><Redo2 size={15} /></Btn>

        <button onClick={() => setPalette(true)} style={{
          display: "flex", alignItems: "center", gap: 8, border: `1px solid ${T.line}`, background: T.paper,
          borderRadius: 8, padding: "6px 10px", cursor: "pointer", color: T.muted, fontSize: 12,
        }}>
          <Search size={14} /> Rechercher
          <Mono style={{ fontSize: 10, background: T.surface, border: `1px solid ${T.line}`, padding: "1px 5px", borderRadius: 4 }}>⌘K</Mono>
        </button>
      </header>

      <div style={{ display: "flex", minHeight: "calc(100vh - 54px)" }}>
        <Rail view={view} setView={setView} channel={channel} issues={issues.filter((i) => i.level === "block").length} />
        <main style={{ flex: 1, minWidth: 0, padding: 12 }}>
          {view === "plan" && (
            <PlanView {...{ events, layout, range, channel, vecteur, selectedId, setSelectedId, dragRef, issues }}
              onDropNew={dropNew} onMoveEvent={moveEvent} onUpdate={updateEvent} onDelete={deleteEvent}
              onDuplicate={duplicateEvent} onSplitSat={splitSat} onOpenTitle={openTitle} />
          )}
          {view === "layout" && <GrilleTypeView layout={layout} setLayout={setLayout} toast={toast} />}
          {view === "auto" && <AutoView layout={layout} range={range} channel={channel} events={events} onGenerate={generate} toast={toast} />}
          {view === "media" && (
            <PlanMediaView events={events} range={range} channel={channel} campagnes={campagnes}
              setCampagnes={setCampagnes} inserts={inserts} setInserts={setInserts} toast={toast} />
          )}
          {view === "catalogue" && <CatalogueView focus={focusTitle} setFocus={setFocusTitle} channel={channel} events={events} toast={toast} />}
          {view === "conducteur" && (
            <ConducteurView events={events} range={range} channel={channel} vecteur={vecteur}
              inserts={inserts} setInserts={setInserts} campagnes={campagnes} toast={toast} />
          )}
          {view === "stock" && <StockView events={events} channel={channel} toast={toast} />}
        </main>
      </div>

      {palette && (
        <CommandPalette onClose={() => setPalette(false)}
          onPickTitle={(id) => { openTitle(id); setPalette(false); }}
          onGoView={(v) => { setView(v); setPalette(false); }} />
      )}

      <div style={{ position: "fixed", right: 16, bottom: 16, display: "flex", flexDirection: "column", gap: 8, zIndex: 140 }}>
        {toasts.map((t) => (
          <div key={t.id} style={{
            background: T.surface, border: `1px solid ${t.kind === "err" ? "#FDA29B" : T.line}`,
            borderLeft: `3px solid ${t.kind === "err" ? T.signal : T.ok}`, padding: "10px 14px",
            borderRadius: 9, fontSize: 12.5, maxWidth: 400, color: T.ink, boxShadow: "0 8px 26px rgba(15,26,42,.14)",
          }}>{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script></body></html>
