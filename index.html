<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=N casse le cache de favicon du navigateur (indexé par URL exacte,
         pas par contenu) — à incrémenter à chaque régénération des icônes
         (npm run brand:icons), sinon l'ancien favicon reste affiché. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png?v=5" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STM — Solution Traffic Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
